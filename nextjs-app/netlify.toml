[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Values the secrets scanner must not fail the build on because they are public or plain words:
  #   NEXT_PUBLIC_* are inlined into the browser bundle by Next.js on purpose (the Supabase anon key is public
  #   by design); JOB_EXECUTION_MODE is the word "netlify" and appears in config and source.
  # Never add a real credential (service-role key, signing secret, Azure/Foundry secrets) here.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,JOB_EXECUTION_MODE"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions-dist"
  included_files = [
    "node_modules/sharp/**",
    "node_modules/@img/**",
    "node_modules/detect-libc/**",
    "node_modules/semver/**",
    "node_modules/color/**",
    "node_modules/color-convert/**",
    "node_modules/color-name/**",
    "node_modules/color-string/**",
    "node_modules/simple-swizzle/**",
    "node_modules/is-arrayish/**",
  ]

# Functions are written in netlify/functions/*.ts and bundled to netlify/functions-dist by `npm run build:functions`.
# Schedules are declared in code (see reap-stale-jobs.ts).
