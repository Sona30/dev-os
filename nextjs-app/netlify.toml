[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* values are inlined into the browser bundle by Next.js on purpose (the Supabase anon key is
  # public by design), so the secrets scanner must not fail the build on them. Never add a server-only key here.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions-dist"
  included_files = [
    "node_modules/sharp/**",
    "node_modules/@img/**",
    "node_modules/detect-libc/**",
    "node_modules/semver/**",
    "node_modules/color/**",
    "node_modules/color-convert/**",
    "node_modules/color-name/**",
    "node_modules/color-string/**",
    "node_modules/simple-swizzle/**",
    "node_modules/is-arrayish/**",
  ]

# Functions are written in netlify/functions/*.ts and bundled to netlify/functions-dist by `npm run build:functions`.
# Schedules are declared in code (see reap-stale-jobs.ts).
